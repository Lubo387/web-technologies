<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоди - Чернівці</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <div class="current-weather">
            <div class="city-info">
                <h1>Чернівці</h1>
                <p class="date">Понеділок, 2 Листопада</p>
                <p class="condition">Хмарно з проясненнями</p>
            </div>

            <div class="main-weather-display">
                <img src="icons/iconfinder_weather02.png" alt="Погода" width="50">
                <span class="temperature">14°</span>
            </div>

            <div class="details-info">
                <p>Опади: 20%</p>
                <p>Вологість: 75%</p>
                <p>Вітер: 3 м/с Зх</p>
            </div>
        </div>

        <div class="forecast-container">
            <div class="forecast-card">
                <span class="day">Сьогодні</span>
                <img src="icons/iconfinder_weather02.png" alt="Погода" width="50">
                <span class="forecast-temp">14° / 8°</span>
            </div>
            <div class="forecast-card">
                <span class="day">Вівторок</span>
                <img src="icons/iconfinder_weather01.png" alt="Погода" width="50">
                <span class="forecast-temp">12° / 6°</span>
            </div>
            <div class="forecast-card">
                <span class="day">Середа</span>
                <img src="icons/iconfinder_weather05.png" alt="Погода" width="50">
                <span class="forecast-temp">15° / 7°</span>
            </div>
            <div class="forecast-card">
                <span class="day">Четвер</span>
                <img src="icons/iconfinder_weather07.png" alt="Погода" width="50">
                <span class="forecast-temp">9° / 3°</span>
            </div>
        </div>
    </div>
</body>
</html>
