<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <div class="weather-wrapper">
        <div class="controls-box">
            <span>&larr;</span>
            <span>&rarr;</span>
        </div>
        <div class="main-card">
            <span class="temp-big">17</span>
        </div>
        <div class="cloud-layer">☁</div>
        <div class="forecast-card">
            <div class="day">Mon <span>17&deg;</span></div>
            <div class="day">Tue <span>19&deg;</span></div>
            <div class="day">Wed <span>16&deg;</span></div>
            <div class="day">Thu <span>18&deg;</span></div>
            <div class="day">Fri <span>21&deg;</span></div>
        </div>
    </div>
</body>
</html>
