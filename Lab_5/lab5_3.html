<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 - Завдання 3</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <div class="form-container">
        <h1>Анкета користувача</h1>
        <form>
            <div class="field-group">
                <label for="username">Ім'я:</label>
                <input type="text" id="username" name="username" placeholder="Введіть ваше ім'я">
            </div>

            <div class="field-group">
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com">
            </div>

            <div class="field-group">
                <label for="city">Місто:</label>
                <select id="city" name="city">
                    <option value="kyiv">Київ</option>
                    <option value="lviv">Львів</option>
                    <option value="odesa">Чернівці</option>
                </select>
            </div>

            <div class="field-group">
                <label>Стать:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Чоловіча</label>
                    <label><input type="radio" name="gender" value="female"> Жіноча</label>
                </div>
            </div>

            <div class="field-group">
                <label for="comments">Коментар:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Ваш коментар..."></textarea>
            </div>

            <button type="submit">Надіслати</button>
        </form>
    </div>

</body>
</html>
